# Quantumult X 完整优化配置 (2026 集成网易云版)

[general]
resource_parser_url = https://raw.githubusercontent.com/crossutility/Quantumult-X/master/resource-parser.js
network_check_url = http://cp.cloudflare.com/generate_204
server_check_url = http://www.google.com/generate_204
server_check_timeout = 3000
running_mode_trigger = filter, filter
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, localhost, *.local
dns_reject_domain_behavior = nxdomain
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8

[dns]
no-system
no-ipv6
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
server = 223.5.5.5
server = 119.29.29.29
server = /*.tmall.com/223.5.5.5
server = /*.taobao.com/223.5.5.5
server = /*.baidu.com/119.29.29.29
server = /*.jd.com/119.29.29.29

[policy]
; --- 策略组 ---
url-latency-benchmark = 自动选路, server-tag-regex=.*, check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Auto.png
static = 手动切换, 自动选路, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Proxy.png

; 1. 网易云音乐专用策略 (可选直连或专用解锁节点)
static = 网易云音乐, direct, 自动选路, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Netease_Music.png

static = 流媒体, 自动选路, 手动切换, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Netflix.png
static = Final, 自动选路, 手动切换, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Final.png

[server_remote]
; YOUR_SUBSCRIBE_URL, tag=MyAirport, update-interval=86400, opt-parser=true

[filter_remote]
; 广告拦截
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Ads/Ads.list, tag=屏蔽广告, force-policy=reject, enabled=true

; 2. 网易云分流规则 (确保网易云流量走特定策略)
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/NetEaseMusic/NetEaseMusic.list, tag=网易云分流, force-policy=网易云音乐, enabled=true

; 流媒体与国外
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=流媒体, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Global/Global.list, tag=全球加速, force-policy=自动选路, enabled=true

; 国内直连
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list, tag=国内直连, force-policy=direct, enabled=true

[rewrite_remote]
; --- 3. 网易云重写脚本 (解锁 VIP 功能/去广告) ---
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/NetEaseMusic/NetEaseMusic.snippet, tag=网易云解锁, enabled=true

; 网页去广告
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.snippet, tag=网页去广告, enabled=true

[filter_local]
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 127.0.0.0/8, direct
final, Final

[mitm]
skip_validating_cert = false
; 使用网易云脚本必须在 hostname 加入以下域名
hostname = music.163.com, *.music.163.com, i.music.163.com
