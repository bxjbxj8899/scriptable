# ==========================================================
# 基础配置
# ==========================================================
mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
secret: ""

profile:
  store-selected: true
  store-fake-ip: true

# Geo 数据自动更新
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# 嗅探器（解决流媒体识别与域名分流）
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.googlevideo.com" # 解决 YouTube 视频加载转圈问题

# TUN 模式配置
tun:
  enable: true
  stack: mixed
  mtu: 1492
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true

# ==========================================================
# 订阅提供者
# ==========================================================
proxy-providers:
  Airport1:
    type: http
    url: "这里填入第一个机场订阅链接"
    interval: 86400
    path: ./proxy_providers/airport1.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  Airport2:
    type: http
    url: "这里填入第二个机场订阅链接"
    interval: 86400
    path: ./proxy_providers/airport2.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ==========================================================
# 策略组（业务逻辑分层）
# ==========================================================
proxy-groups:
  - name: 🚀 默认代理
    type: select
    use:
      - Airport1
      - Airport2
    proxies:
      - ⚡ 自动选择
      - 🔁 故障转移
      - DIRECT

  - name: 🤖 人工智能
    type: select
    use:
      - Airport1
      - Airport2
    proxies:
      - 🚀 默认代理
      - ⚡ 自动选择

  - name: ⚡ 自动选择
    type: url-test
    use:
      - Airport1
      - Airport2
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🔁 故障转移
    type: fallback
    use:
      - Airport1
      - Airport2
    url: https://www.gstatic.com/generate_204
    interval: 300

  - name: 🐟 漏网之鱼
    type: select
    use:
      - Airport1
      - Airport2
    proxies:
      - 🚀 默认代理
      - DIRECT

# ==========================================================
# DNS 配置（Fake-IP + 分流屏蔽泄露）
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.localdomain"
    - "+.ntp.org"
    - "+.pool.ntp.org"
    - "time.*.com"

  # DNS 分流策略
  nameserver-policy:
    # 国内域名查询
    "geosite:private,cn,apple-cn,microsoft@cn,steam@cn":
      - 223.5.5.5
      - 119.29.29.29
    # 国外域名通过代理进行 DoH 查询，彻底防污染
    "geosite:google,youtube,telegram,gfw,geolocation-!cn":
      - "https://1.1.1.1/dns-query#🚀 默认代理"
      - "https://dns.google/dns-query#🚀 默认代理"

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - "https://1.1.1.1/dns-query#🚀 默认代理"
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ==========================================================
# 分流规则
# ==========================================================
rules:
  # 1. 局域网直连
  - GEOSITE,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve

  # 2. AI 业务（对 IP 敏感，独立分组）
  - GEOSITE,openai,🤖 人工智能
  - GEOSITE,anthropic,🤖 人工智能
  - GEOSITE,deepseek,DIRECT # DeepSeek 建议直连

  # 3. 国外重点业务
  - GEOSITE,google,🚀 默认代理
  - GEOSITE,youtube,🚀 默认代理
  - GEOSITE,telegram,🚀 默认代理
  - GEOSITE,github,🚀 默认代理

  # 4. 国内常用业务直连
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,cn,DIRECT

  # 5. 基于 IP 的最后判断
  - GEOIP,CN,DIRECT,no-resolve

  # 6. 兜底
  - MATCH,🐟 漏网之鱼
