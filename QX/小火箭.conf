# ===================================================
# 🚀 Shadowrocket 精简配置（优化版）
# 地区优先：🇭🇰 香港 > 🇸🇬 新加坡 > 🇯🇵 日本 > 🇹🇼 台湾 > 🇺🇸 美国
# 广告屏蔽：关闭
# 模块：无（可自行添加）
# 更新时间：2025-10-15
# ===================================================

[General]
bypass-system = true
skip-proxy = 127.0.0.1, localhost
dns-server = system, 223.5.5.5, 1.1.1.1, 8.8.8.8
dns-fallback-system = true
ipv6 = true
geoip-db = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
always-reject-url-rewrite = false
update-url = https://example.com/myconfig.conf

# ===================================================
# 🌐 策略组定义（Policy）
# ===================================================
[Policy]
# 主策略组：香港优先，其次新加坡/日本/台湾/美国
Proxy = select, 香港, 新加坡, 日本, 台湾, 美国, DIRECT

# 五区自动测速分组
香港 = url-test, HK, url = http://www.gstatic.com/generate_204, interval = 600, timeout = 5
台湾 = url-test, TW, url = http://www.gstatic.com/generate_204, interval = 600, timeout = 5
日本 = url-test, JP, url = http://www.gstatic.com/generate_204, interval = 600, timeout = 5
新加坡 = url-test, SG, url = http://www.gstatic.com/generate_204, interval = 600, timeout = 5
美国 = url-test, US, url = http://www.gstatic.com/generate_204, interval = 600, timeout = 5

# ===================================================
# 🎯 分流规则（Rule）
# ===================================================

# --- 国内直连 ---
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-KEYWORD,baidu,DIRECT
DOMAIN-KEYWORD,bilibili,DIRECT
DOMAIN-KEYWORD,wechat,DIRECT
DOMAIN-KEYWORD,qq,DIRECT
DOMAIN-KEYWORD,alipay,DIRECT
DOMAIN-KEYWORD,weibo,DIRECT

# --- 局域网直连 ---
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

# --- 国外常用网站自动代理（香港优先） ---
DOMAIN-SUFFIX,google.com,Proxy
DOMAIN-SUFFIX,gstatic.com,Proxy
DOMAIN-SUFFIX,youtube.com,Proxy
DOMAIN-SUFFIX,facebook.com,Proxy
DOMAIN-SUFFIX,instagram.com,Proxy
DOMAIN-SUFFIX,twitter.com,Proxy
DOMAIN-SUFFIX,telegram.org,Proxy
DOMAIN-SUFFIX,openai.com,Proxy
DOMAIN-SUFFIX,github.com,Proxy
DOMAIN-SUFFIX,netflix.com,Proxy
DOMAIN-SUFFIX,spotify.com,Proxy
DOMAIN-SUFFIX,discord.com,Proxy
DOMAIN-SUFFIX,reddit.com,Proxy
DOMAIN-SUFFIX,wikipedia.org,Proxy

# --- GEOIP 自动分流 ---
GEOIP,CN,DIRECT

# --- 其他所有请求默认使用香港优先组 ---
FINAL,Proxy

# ===================================================
# 📦 模块引用（可选）
# ===================================================
# [Module]
# https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/modules/script-hub.rocket.module
